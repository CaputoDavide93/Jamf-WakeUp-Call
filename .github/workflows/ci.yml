name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagrams up to date
        run: python3 tools/gen_diagram.py --check
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest tests/ -v
