name: Environment report
description: Tell us what works or fails on your setup
labels: [environment]
body:
  - type: markdown
    attributes:
      value: |
        Remove tokens, passwords, server URLs, serial numbers, computer names and user names before you paste anything.
  - type: input
    id: jamf
    attributes:
      label: Jamf Pro version and hosting
      placeholder: "11.x, cloud"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: "3.12, macOS"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: Use example serials and IDs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: Expected result, actual result and the exit code.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: From a run with LOG_LEVEL=DEBUG, with identifiers removed.
      render: text
