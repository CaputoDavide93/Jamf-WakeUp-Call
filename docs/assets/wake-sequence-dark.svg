<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690" role="img" aria-label="The operator runs main.py, which gets a bearer token from Jamf Pro when it has no API token, resolves the dynamic group, serial or serial file to computer records, and asks for confirmation. Unless --dry-run is set it then posts one management-framework redeploy per computer; Jamf Pro sends the MDM command over APNs and the Mac reinstalls the Jamf framework."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="28.0" y="26" width="176" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(44.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.6-6 8-6s8 2 8 6"/></g><text x="75.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Operator</text><line x1="116" y1="70" x2="116" y2="616" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="252.0" y="26" width="176" height="44" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(268.0,38.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3z M7 10l3 2.5L7 15 M12.5 15h4.5"/></g><text x="299.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600">main.py</text><line x1="340" y1="70" x2="340" y2="616" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="732.0" y="26" width="176" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(748.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v6H4z M4 14h16v6H4z M7 7h.01 M7 17h.01 M11 7h6 M11 17h6"/></g><text x="779.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Jamf Pro</text><line x1="820" y1="70" x2="820" y2="616" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="976.0" y="26" width="176" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(992.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H5z M2 19h20 M9 19l1-2h4l1 2"/></g><text x="1023.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Mac</text><line x1="1064" y1="70" x2="1064" y2="616" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="210" y="380" width="740" height="106" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5 4"/><text x="224.0" y="398.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="start" font-weight="600">for each computer, unless --dry-run</text><polyline points="124,100 332,100" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="228.0" y="91.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">python3 -m src.main</text><text x="228.0" y="119.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="middle">group, one serial or a file</text><polyline points="348,146 812,146" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="580.0" y="137.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">POST /api/v1/auth/token</text><text x="580.0" y="165.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="middle">skipped when an API token is set</text><polyline points="812,200 348,200" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="580.0" y="191.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">bearer token</text><polyline points="348,246 812,246" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="580.0" y="237.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">GET /JSSResource/computergroups/id/{id}</text><text x="580.0" y="265.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">or /JSSResource/computers/serialnumber/{sn}</text><polyline points="812,300 348,300" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="580.0" y="291.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">computer records</text><polyline points="332,334 124,334" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="228.0" y="325.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">Do you want to proceed?</text><polyline points="124,364 332,364" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="228.0" y="355.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">yes</text><polyline points="348,430 812,430" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="580.0" y="421.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">POST /api/v1/jamf-management-framework/redeploy/{id}</text><polyline points="812,466 348,466" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="580.0" y="457.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">deviceId, commandUuid</text><polyline points="828,518 1056,518" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="942.0" y="509.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">MDM command via APNs</text><rect x="976" y="540" width="176" height="64" rx="10" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="992.0" y="568.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Jamf framework</text><text x="992.0" y="592.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">reinstalled</text><line x1="24" y1="638" x2="1156" y2="638" stroke="#232a33" stroke-width="1"/><text x="24.0" y="664.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Superseded by the wakeup module in Jamf-SnipeIT-Suite. Reads are retried on 429 and 5xx; a redeploy is sent once, never retried.</text></svg>